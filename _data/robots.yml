- id: hsr
  name: Toyota HSR
  category:
    en: Assistive mobile manipulation
    ko: 일상 보조와 이동형 로봇 조작
  research_media:
    image: assets/img/projects/assistive-manipulation/user-directive.png
    alt: Our Toyota HSR retrieving an object from a table and clearing objects from a sofa.
    caption:
      en: Our HSR following natural-language instructions in a household environment.
      ko: 가정 환경에서 자연어 지시에 따라 작업을 수행하는 HSR.
  achievements:
    - year: 2023
      event:
        en: RoboCup@Home
        ko: 로보컵앳홈
      award:
        en: Champion · DSPL & OPL leagues
        ko: DSPL·OPL 양대 리그 우승
      description:
        en: Our Toyota HSR took on household service tasks, from welcoming guests and storing groceries to serving breakfast and helping with dinner in the final.
        ko: Toyota HSR로 손님 맞이, 식료품 정리, 아침 식사 준비 등 가정 내 서비스 과제를 수행하고, 결승에서는 저녁 식사를 도왔습니다.
      image: assets/img/awards/robocup-home-2023.png
      image_alt: The team celebrating its RoboCup@Home 2023 championship.
      demos:
        - title:
            en: RoboCup@Home 2023 · Competition highlights and final
            ko: 2023 로보컵앳홈 · 대회 하이라이트와 결승
          src: assets/video/robots/hsr/robocup-2023-highlights.mp4
          poster: assets/img/robots/hsr/robocup-2023-dinner-service.jpg
          poster_source_timestamp: "00:13:43"
          duration: "15:05"
          source_file: robocup2023 full.MOV
  experience:
    en: We build open-vocabulary 3D maps with OV-MAP and mobile robot systems that ground natural-language requests in the scene, retrieve and move household objects, and interact with people to offer assistance.
    ko: OV-MAP으로 개방형 어휘 기반 3D 지도를 구축하고, 자연어 요청을 실제 장면과 연결하여 생활 물품을 찾아 옮기며 사람과의 상호작용을 통해 도움을 제공하는 이동형 로봇 시스템을 개발합니다.
  projects:
