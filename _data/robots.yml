    - year: 2026
      event:
        en: AI Co-Scientist Challenge Korea
        ko: AI Co-Scientist Challenge Korea
      award:
        en: Head of LG AI Research Award · Excellence Award
        ko: LG AI연구원장상 · 우수상
      description:
        en: Our AI agents generate and validate robot-training data in digital twins of real environments. The demo follows scene reconstruction, failure correction, and policy training through to deployment on the FFW-SG2.
        ko: 실제 환경을 복원한 디지털 트윈에서 로봇 학습 데이터를 자동 생성·검증하는 AI 에이전트 시스템을 개발했습니다. 환경 복원과 실패 교정, 정책 학습을 실제 FFW-SG2 구동까지 연결합니다.
      image: assets/img/profile/robi_ex.jpeg
      image_alt: Team ROBI with its Excellence Award at the 2026 AI Co-Scientist Challenge Korea.
      demos:
        - title:
            en: Digital twin to real robot · System demo
            ko: 디지털 트윈에서 실제 로봇까지 · 시스템 시연
          src: assets/video/robots/ai-worker/ai-co-scientist-2026-system-demo.mp4
          poster: assets/img/robots/ai-worker/ai-co-scientist-2026-system-demo.jpg
          poster_source_timestamp: "00:02:14"
          duration: "2:16"
          source_file: 2026_AI-Co-Scientist/최종발표영상.mp4
  experience:
    en: We turn scene captures and human demonstrations into robot-training data. OffSite connects navigation and manipulation using one capture of the deployment scene. Head2Wrist develops wrist-camera policies from human head-camera demonstrations, achieving 18/20 cube-into-bowl successes near demonstrated starts using views generated from three demonstrations.
    ko: 환경 촬영과 사람 시연을 로봇 학습 데이터로 연결합니다. OffSite는 실제 작업 환경을 한 번 촬영한 데이터로 이동과 조작을 함께 학습합니다. Head2Wrist는 사람의 헤드 카메라 시연을 손목 카메라 정책으로 연결하여, 시연 3개에서 생성한 영상으로 학습한 큐브 담기 실험에서 시연 시작점 근처 20회 중 18회 성공했습니다.
  projects:
    - name: Head2Wrist
